name: Merge daily data branches
on:
  schedule:
    - cron: '15 8,9,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: wordhunt-branch-maintenance
  cancel-in-progress: false
jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate and merge daily data pull requests
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
        run: bash scripts/merge_prs.sh
