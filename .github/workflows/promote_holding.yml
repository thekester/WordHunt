name: Promote holding to dev and main
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: wordhunt-branch-maintenance
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - name: Merge holding into dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin holding main
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
          else
            git checkout -b dev origin/main
          fi
          git merge --no-edit origin/main
          git merge --no-edit origin/holding
          git push origin dev
      - name: Promote dev through a pull request
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
        run: |
          git fetch origin main dev
          if git diff --quiet origin/main origin/dev; then
            echo 'No content to promote'
            exit 0
          fi
          pr=$(gh pr list --head dev --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --head dev --base main --title 'Promote dev to main' --body 'Automated promotion from holding')
          fi
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$pr" --json mergeable --jq .mergeable)
            if [ "$state" = MERGEABLE ]; then
              sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
              gh pr merge "$pr" --merge --match-head-commit "$sha"
              exit 0
            fi
            if [ "$state" = CONFLICTING ]; then
              echo 'Promotion has conflicts; manual resolution required' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'GitHub could not determine mergeability; retry this workflow' >&2
          exit 1
