name: Sync main into holding
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordhunt-branch-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - name: Merge main without discarding holding changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/holding; then
            git checkout -B holding origin/holding
            git merge --no-edit origin/main
          else
            git checkout -b holding origin/main
          fi
          git push origin holding
