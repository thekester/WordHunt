name: Fetch Robert Word of the Day
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: fetch-robert
  cancel-in-progress: false
jobs:
  fetch_word:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch and validate today's record
        id: collect
        run: python scripts/fetch_word.py robert --base-ref origin/holding --output-dir "$RUNNER_TEMP/wordhunt-robert"
      - name: Prepare holding base and copy only the collected record
        env:
          FILENAME: ${{ steps.collect.outputs.filename }}
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/holding; then
            git checkout -B holding origin/holding
          else
            git checkout -b holding origin/main
            git push origin holding
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/wordhunt-robert/$FILENAME" "data/$FILENAME"
      - name: Open data pull request
        uses: peter-evans/create-pull-request@v7.0.6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          base: holding
          branch: add-robert-word-of-the-day-${{ steps.collect.outputs.date }}
          add-paths: data/${{ steps.collect.outputs.filename }}
          commit-message: 'Add Robert word of the day for ${{ steps.collect.outputs.date }}'
          title: 'Add Robert word of the day for ${{ steps.collect.outputs.date }}'
          body: 'Validated daily record collected from Robert.'
