name: Salvage stale branches data
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: wordhunt-branch-maintenance
  cancel-in-progress: false
jobs:
  salvage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recover missing validated records into main
        run: python scripts/salvage_data.py
      - uses: peter-evans/create-pull-request@v7.0.6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          base: main
          branch: salvage-stale-data
          add-paths: data/*.json
          commit-message: Recover missing validated daily records
          title: Recover missing daily records from stale branches
          body: 'Adds only missing validated JSON files; existing records are preserved. Review before merging.'
