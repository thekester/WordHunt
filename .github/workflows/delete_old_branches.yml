name: Delete old merged data branches
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: wordhunt-branch-maintenance
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          script: |
            const repo = context.repo;
            const {data: main} = await github.rest.repos.getBranch({...repo, branch: 'main'});
            const open = await github.paginate(github.rest.pulls.list, {...repo, state: 'open', per_page: 100});
            const branches = await github.paginate(github.rest.repos.listBranches, {...repo, protected: false, per_page: 100});
            for (const branch of branches) {
              if (!/^add-(dicolink|robert)-word-of-the-day-/.test(branch.name)) continue;
              if (open.some(pr => pr.head.repo?.full_name === `${repo.owner}/${repo.repo}` && pr.head.ref === branch.name)) continue;
              const {data: commit} = await github.rest.repos.getCommit({...repo, ref: branch.commit.sha});
              const age = Date.now() - new Date(commit.commit.committer.date).getTime();
              if (!Number.isFinite(age) || age <= 3 * 86400000) continue;
              // A branch is safe to prune only when all its commits are in main.
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...repo, basehead: `${branch.commit.sha}...${main.commit.sha}`
              });
              if (!['ahead', 'identical'].includes(comparison.status)) continue;
              const {data: current} = await github.rest.repos.getBranch({...repo, branch: branch.name});
              if (current.commit.sha !== branch.commit.sha) continue;
              await github.rest.git.deleteRef({...repo, ref: `heads/${branch.name}`});
              core.info(`Deleted merged branch ${branch.name}`);
            }
